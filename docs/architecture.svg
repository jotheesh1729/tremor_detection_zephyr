<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1040" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="1040" fill="#ffffff"/>

  <!-- Box 1 -->
  <rect x="60" y="20" width="700" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">LSM6DSL FIFO</text>
  <text x="410" y="68" text-anchor="middle" font-size="12" fill="#000000">accelerometer + gyroscope, hardware watermark interrupt</text>

  <line x1="410" y1="86" x2="410" y2="146" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="112" font-size="11" fill="#000000">GPIO interrupt</text>
  <text x="430" y="127" font-size="11" fill="#000000">ISR only signals a semaphore</text>

  <!-- Box 2 -->
  <rect x="60" y="146" width="700" height="94" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">LSM6DSL driver thread</text>
  <text x="85" y="196" font-size="12" fill="#000000">blocking I2C burst read of the FIFO on watermark wake</text>
  <text x="85" y="216" font-size="12" fill="#000000">invokes the app's registered sensor trigger callback once per sample</text>

  <line x1="410" y1="240" x2="410" y2="296" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="272" font-size="11" fill="#000000">sensor_trigger_handler_t</text>

  <!-- Box 3 -->
  <rect x="60" y="296" width="700" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Trigger callback -&gt; sample queue (k_msgq)</text>

  <line x1="410" y1="352" x2="410" y2="402" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4 -->
  <rect x="60" y="402" width="700" height="212" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">DSP thread</text>
  <text x="85" y="452" font-size="12" fill="#000000">1  Gravity removal, high-pass filter per axis</text>
  <text x="85" y="472" font-size="12" fill="#000000">2  Magnitude vector, orientation independent</text>
  <text x="85" y="492" font-size="12" fill="#000000">3  50% overlapping Hann window, real FFT (CMSIS-DSP)</text>
  <text x="85" y="512" font-size="12" fill="#000000">4  Peak frequency, band power, relative spectral concentration, gyroscope RMS</text>
  <text x="85" y="532" font-size="12" fill="#000000">5  Classification: none / tremor / dyskinesia / activity</text>
  <text x="85" y="560" font-size="11" fill="#000000">relative_power = P(peak +/- 0.5 Hz) / P(0.5 to 15 Hz)</text>
  <line x1="85" y1="572" x2="735" y2="572" stroke="#000000" stroke-width="0.5"/>
  <text x="85" y="592" font-size="11" fill="#000000">gate: relative_power below threshold, gross motion, or excess gyro RMS -&gt; activity</text>

  <line x1="410" y1="614" x2="410" y2="670" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="646" font-size="11" fill="#000000">per-window classification result</text>

  <!-- Box 5 -->
  <rect x="60" y="670" width="700" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="696" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Episode state machine (hysteresis)</text>
  <text x="85" y="720" font-size="12" fill="#000000">idle -&gt; candidate (K of N windows) -&gt; episode -&gt; cooldown</text>
  <text x="85" y="740" font-size="12" fill="#000000">record: type, duration, dominant frequency, mean severity</text>

  <line x1="410" y1="770" x2="410" y2="826" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="802" font-size="11" fill="#000000">episode closed</text>

  <!-- Box 6 -->
  <rect x="60" y="826" width="700" height="140" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="852" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">BLE GATT service</text>
  <text x="85" y="876" font-size="12" fill="#000000">Report characteristic, notified periodically (default every 5 minutes):</text>
  <text x="100" y="894" font-size="12" fill="#000000">episode counts, durations, and mean severity since the last report</text>
  <text x="85" y="920" font-size="12" fill="#000000">Episode characteristic, notified when an episode closes:</text>
  <text x="100" y="938" font-size="12" fill="#000000">type, duration, dominant frequency, mean severity</text>
</svg>
