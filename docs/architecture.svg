<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1060" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1060" fill="#ffffff"/>

  <!-- Box 1: Hardware -->
  <rect x="90" y="20" width="700" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="440" y="50" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">LSM6DSL FIFO</text>
  <text x="440" y="72" text-anchor="middle" font-size="13" fill="#475569">accelerometer + gyroscope, hardware watermark interrupt</text>

  <line x1="440" y1="90" x2="440" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="123" font-size="12" font-style="italic" fill="#64748b">GPIO interrupt</text>
  <text x="460" y="138" font-size="12" font-style="italic" fill="#64748b">ISR only signals a semaphore</text>

  <!-- Box 2: Driver thread -->
  <rect x="90" y="150" width="700" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="440" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">LSM6DSL driver thread</text>
  <text x="115" y="202" font-size="13" fill="#475569">blocking I2C burst read of the FIFO on watermark wake</text>
  <text x="115" y="222" font-size="13" fill="#475569">invokes the app's registered sensor trigger callback once per sample</text>

  <line x1="440" y1="250" x2="440" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="283" font-size="12" font-style="italic" fill="#64748b">sensor_trigger_handler_t</text>

  <!-- Box 3: App glue -->
  <rect x="90" y="310" width="700" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="440" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Trigger callback -&gt; sample queue (k_msgq)</text>

  <line x1="440" y1="370" x2="440" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: DSP thread -->
  <rect x="90" y="420" width="700" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="440" y="448" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">DSP thread</text>
  <text x="115" y="474" font-size="13" fill="#475569">1  Gravity removal, high-pass filter per axis</text>
  <text x="115" y="496" font-size="13" fill="#475569">2  Magnitude vector, orientation independent</text>
  <text x="115" y="518" font-size="13" fill="#475569">3  50% overlapping Hann window, real FFT (CMSIS-DSP)</text>
  <text x="115" y="540" font-size="13" fill="#475569">4  Peak frequency, band power, relative spectral</text>
  <text x="130" y="560" font-size="13" fill="#475569">concentration, gyroscope RMS</text>
  <text x="115" y="582" font-size="13" fill="#475569">5  Classification: none / tremor / dyskinesia / activity</text>
  <text x="115" y="610" font-size="12" font-style="italic" fill="#64748b">relative_power = P(peak +/- 0.5 Hz) / P(0.5 to 15 Hz)</text>

  <line x1="440" y1="640" x2="440" y2="700" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="673" font-size="12" font-style="italic" fill="#64748b">per-window classification result</text>

  <!-- Box 5: Episode FSM -->
  <rect x="90" y="700" width="700" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="440" y="728" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Episode state machine (hysteresis)</text>
  <text x="115" y="754" font-size="13" fill="#475569">idle -&gt; candidate (K of N windows) -&gt; episode -&gt; cooldown</text>
  <text x="115" y="776" font-size="13" fill="#475569">record: type, duration, dominant frequency, mean severity</text>

  <line x1="440" y1="810" x2="440" y2="870" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="843" font-size="12" font-style="italic" fill="#64748b">episode closed</text>

  <!-- Box 6: BLE -->
  <rect x="90" y="870" width="700" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="440" y="898" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">BLE GATT service</text>
  <text x="115" y="924" font-size="13" fill="#475569">Report characteristic, notified periodically (default every 5 minutes):</text>
  <text x="130" y="944" font-size="13" fill="#475569">episode counts, durations, and mean severity since the last report</text>
  <text x="115" y="972" font-size="13" fill="#475569">Episode characteristic, notified when an episode closes:</text>
  <text x="130" y="992" font-size="13" fill="#475569">type, duration, dominant frequency, mean severity</text>
</svg>
