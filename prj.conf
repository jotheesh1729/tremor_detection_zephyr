CONFIG_LOG=y
CONFIG_GPIO=y

# Float formatting in printk, for the %.4f Teleplot output lines in main.c.
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Zephyr's in-tree LSM6DSL driver defaults to enabled whenever a matching
# devicetree node exists (drivers/sensor/st/lsm6dsl/Kconfig, default y).
# It must be turned off so our out-of-tree driver is the only one that
# claims this devicetree instance.
CONFIG_LSM6DSL=n
CONFIG_LSM6DSL_CUSTOM=y

# CMSIS-DSP: real FFT (arm_rfft_fast_f32) for the DSP pipeline window
# analysis, plus the basic math functions the transform code needs.
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_BASICMATH=y

# cosf/sqrtf/logf/ceilf/floorf (Hann window, FFT, feature extraction).
CONFIG_REQUIRES_FULL_LIBC=y

# FPU: the pipeline runs entirely in single-precision float, and the
# STM32L475's Cortex-M4F has a hardware FPU to run it on.
CONFIG_FPU=y

# BLE: CONFIG_BT_SPI_BLUENRG (the SPBTLE-RF's driver) auto-selects itself
# from the board's own devicetree (hci_spi node, "st,hci-spi-v1") once
# CONFIG_BT is on -- no separate driver Kconfig needed.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tremor Monitor"
